{% load i18n %}
<div class="card">
    <div class="card-header"><h6 class="mb-0"><i class="fa-solid fa-headset"></i> {% trans "TeamSpeak" %}</h6></div>
    <div class="card-body">
        {% if teamspeak3_user %}
        <dl class="mb-0">
            <dt class="text-muted small text-uppercase">{% trans "UID" %}</dt>
            <dd><code>{{ teamspeak3_user.uid }}</code></dd>
            <dt class="text-muted small text-uppercase">{% trans "Registration Key" %}</dt>
            <dd class="mb-0"><code>{{ teamspeak3_user.perm_key }}</code></dd>
        </dl>
        {% else %}
        <p class="text-muted mb-0">{% trans "No TeamSpeak account registered." %}</p>
        {% endif %}
    </div>
</div>
